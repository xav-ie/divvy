<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Two overlapping circles with the overlap filled: what we share. -->
  <rect width="512" height="512" fill="#0b7560"/>
  <clipPath id="a"><circle cx="196" cy="256" r="126"/></clipPath>
  <circle cx="316" cy="256" r="126" fill="#fff" clip-path="url(#a)"/>
  <g fill="none" stroke="#fff" stroke-width="32">
    <circle cx="196" cy="256" r="126"/>
    <circle cx="316" cy="256" r="126"/>
  </g>
</svg>
